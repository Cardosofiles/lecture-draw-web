# Banco local para desenvolvimento e para rodar a suíte de integração sem
# gastar conexões do Neon.
#
#   docker compose up -d          # sobe o Postgres
#   docker compose down           # para (mantém os dados)
#   docker compose down -v        # para e APAGA o volume — o próximo boot
#                                 # reimporta os dumps de ./docker/initdb
#
# No .env local:
#   DATABASE_URL="postgresql://lecture:lecture@localhost:5433/lecture_draw"
#
# A porta do host é 5433 para não brigar com um Postgres já publicado em 5432
# por outro projeto. Sobrescreva com POSTGRES_PORT=5432 no ambiente se quiser.

services:
  postgres:
    image: postgres:17-alpine
    container_name: lecture-draw-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lecture
      POSTGRES_PASSWORD: lecture
      POSTGRES_DB: lecture_draw
      # Deixa o timezone do container igual ao do evento para que datas lidas
      # direto no psql batam com o que a aplicação mostra.
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Dumps colocados aqui rodam UMA vez, no primeiro boot de um volume vazio.
      # Aceita .sql, .sql.gz e .sh — para um dump binário (-Fc) use pg_restore
      # manualmente, o entrypoint não trata .dump.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecture -d lecture_draw"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
